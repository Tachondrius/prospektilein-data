name: Validate Prospektilein Catalog
on:
  workflow_dispatch:
  push:
    paths:
      - "retailers.json"
      - "brochures.json"
      - "sources.json"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-catalog.yml"
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate data catalogs
        run: python scripts/validate_catalog.py
