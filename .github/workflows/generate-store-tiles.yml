name: Generate Austria store tiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: PyOsmium installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium==4.3.1

      - name: Österreich-OSM-Daten laden
        run: |
          mkdir -p data
          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            -o data/austria-latest.osm.pbf \
            https://download.geofabrik.de/europe/austria-latest.osm.pbf

      - name: Store-Tiles erzeugen
        run: |
          python tools/generate_store_tiles.py \
            data/austria-latest.osm.pbf \
            stores

      - name: Tiles ins Repository schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stores

          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Tiles."
            exit 0
          fi

          git commit -m "Update Austria store tiles"
          git push
