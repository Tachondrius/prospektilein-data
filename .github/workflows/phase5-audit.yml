name: Phase 5 - Source Health and Validity
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,17 * * *"
  push:
    paths:
      - "sources.json"
      - "brochures.json"
      - "scripts/phase5_audit.py"
      - "tests/test_phase5_audit.py"
      - ".github/workflows/phase5-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -p "test_phase5_audit.py" -v
      - name: Audit
        run: python scripts/phase5_audit.py
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-report
          path: phase5-report.json
          if-no-files-found: warn
