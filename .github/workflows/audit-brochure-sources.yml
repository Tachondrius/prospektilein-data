name: Audit Brochure Sources (Phase 4)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source audit
        run: python -m unittest discover -s tests -p "test_source_audit.py" -v
      - name: Check source URLs
        run: python scripts/source_audit.py --audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-report
          path: source-audit-report.json
          if-no-files-found: ignore
